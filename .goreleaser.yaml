version: 2

project_name: kubedmp

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod download

builds:
  - binary: kubedmp
    main: ./cmd/main.go
    targets:
      - linux_amd64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    env:
      - BUILD_USER={{ if index .Env "GITHUB_ACTOR" }}{{ .Env.GITHUB_ACTOR }}{{ else }}{{ .Env.USER }}{{ end }}
    ldflags:
      - -s -w -X 'github.com/shundezhang/kubedmp/cmd/build.Version={{.Version}}' -X 'github.com/shundezhang/kubedmp/cmd/build.User={{ .Env.BUILD_USER }}' -X 'github.com/shundezhang/kubedmp/cmd/build.Time={{.Now}}'

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}'
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
  extra_files:
    - glob: ./CHANGELOG.md

homebrew_casks:
  - name: kubedmp
    homepage: https://github.com/shundezhang/kubedmp
    description: Display output of 'kubectl cluster-info dump' nicely
    repository:
      owner: shundezhang
      name: homebrew-kubedmp

snapcrafts:
  - summary: Display output of 'kubectl cluster-info dump' nicely
    publish: true
    description: |
      Display output of 'kubectl cluster-info dump' nicely
    grade: stable
    confinement: strict
    license: Apache-2.0
    apps:
      kubedmp:
        plugs: ["home", "network"]
        command: kubedmp
